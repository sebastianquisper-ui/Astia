<!doctype html>

<head>

<body>
<title>Alpi 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-screen stage — the 3D canvas fills the space, a soft cream control tray sits at the bottom with three scrollable chip rows. Single committed look: Alpi's pink studio backdrop. */
:root{
  --stage:#F3DCC6;
  --stage-deep:#E7C3A6;
  --cream:#FFF6EE;
  --ink:#5B2E1E;
  --ink-soft:#8A5A47;
  --coral:#D9474F;
  --display:"Baloo 2","Nunito",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-level="1"]{--stage:#F4A6C1;--stage-deep:#EC8FB1;--coral:#EF6450;}
:root[data-level="3"]{--stage:#DCE7F5;--stage-deep:#B9CFEC;--coral:#3C6BB0;}
:root[data-level="4"]{--stage:#F6E6DE;--stage-deep:#E4C2B5;--coral:#C7303A;}
:root[data-level="4"] .lvl{background:#1F3C88;color:#F6D27A}
html,body{height:100%}
body{
  background:radial-gradient(120% 80% at 50% 38%, var(--stage) 0%, var(--stage) 45%, var(--stage-deep) 100%);
  color:var(--ink);font-family:var(--body);overflow:hidden;
}
.app{height:100%;display:grid;grid-template-rows:1fr auto;}
.stage{position:relative;min-height:0;}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
#stage.dragging{cursor:grabbing}
.top{
  position:absolute;top:0;left:0;right:0;pointer-events:none;
  padding-top:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
}
.top h1{margin:0;font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;color:var(--cream);
  text-shadow:0 2px 0 rgba(91,46,30,.18);letter-spacing:.01em}
.lvl{font-family:var(--display);font-weight:800;font-size:.82rem;line-height:1;color:var(--coral);background:var(--cream);padding:5px 10px 4px;border-radius:999px;align-self:center}
.top h1{color:var(--coral)!important;text-shadow:0 2px 0 rgba(255,255,255,.6)!important}
.top p{margin:0;font-size:.82rem;font-weight:700;color:var(--ink);opacity:.72}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:600;
  font-size:1.1rem;color:var(--ink);text-align:center;padding-inline:24px}
.panel{
  background:color-mix(in srgb, var(--cream) 90%, transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:22px 22px 0 0;
  box-shadow:0 -6px 24px rgba(91,46,30,.10);
  padding-block:10px 12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid;gap:8px;
}
.row{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px;max-width:900px;width:100%;margin-inline:auto;min-width:0}
.label{font-family:var(--display);font-weight:800;font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.chips{display:flex;gap:7px;min-width:0;overflow-x:auto;scrollbar-width:none;padding-block:2px;
  -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:24px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  font:700 .9rem/1 var(--body);color:var(--ink);
  background:#fff;border:2px solid rgba(91,46,30,.12);border-radius:999px;
  padding:9px 14px;cursor:pointer;transition:transform .12s ease, background .15s ease, color .15s ease, border-color .15s ease;
}
.chip:hover{border-color:var(--coral)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--coral);color:#fff;border-color:var(--coral)}
.chip:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (max-width:520px){
  .row{grid-template-columns:1fr;gap:5px}
  .chip{padding:8px 12px;font-size:.86rem}
  .top h1{font-size:1.7rem}
}
@media (min-width:1000px){.chips{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none;padding-right:0}}
@media (prefers-reduced-motion:reduce){.chip{transition:none}}
</style>

<div class="app">

    <header class="top">
      <h1>Alpi</h1><span class="lvl" id="lvlBadge">Nivel 2</span>

        <button class="chip" id="e-curiosa" data-e="curiosa" aria-pressed="false">Curioso</button>
        <button class="chip" id="e-dormida" data-e="dormida" aria-pressed="false">Dormido</button>
        <button class="chip" id="e-concentrada" data-e="concentrada" aria-pressed="false">Concentrado</button>
        <button class="chip" id="e-sorpresa" data-e="sorpresa" aria-pressed="false">Sorpresa</button>
        <button class="chip" id="e-triste" data-e="triste" aria-pressed="false">Triste</button>
        <button class="chip" id="e-guino" data-e="guino" aria-pressed="false">Guiño</button>
        <button class="chip" id="e-molesta" data-e="molesta" aria-pressed="false">Molesto</button>
        <button class="chip" id="e-furiosa" data-e="furiosa" aria-pressed="false">Furioso</button>
        <button class="chip" id="e-reganona" data-e="reganona" aria-pressed="false">Regañón</button>
        <button class="chip" id="e-orgullosa" data-e="orgullosa" aria-pressed="false">Orgulloso</button>
      </div>
    </div>
    <div class="row">
      <span class="label">Acciones</span>
      <div class="chips" id="actions">
        <button class="chip" id="a-saludar" data-a="saludar" aria-pressed="false">Saludar</button>
        <button class="chip" id="a-saltar" data-a="saltar" aria-pressed="false">Saltar</button>
        <button class="chip" id="a-bailar" data-a="bailar" aria-pressed="false">Bailar</button>
        <button class="chip" id="a-risa" data-a="risa" aria-pressed="false">Reír</button>
        <button class="chip" id="a-explorar" data-a="explorar" aria-pressed="false">Explorar</button>
      </div>
    </div>
    <div class="row" id="accRow">
      <span class="label">Accesorios</span>
      <div class="chips" id="acc">
        <button class="chip" id="c-chaqueta" data-c="chaqueta" data-lv="3" aria-pressed="true">Chaqueta</button>
        <button class="chip" id="c-corona" data-c="corona" data-lv="4" aria-pressed="true">Corona</button>
        <button class="chip" id="c-capa" data-c="capa" data-lv="4" aria-pressed="true">Capa</button>
        <button class="chip" id="c-baston4" data-c="baston4" data-lv="4" aria-pressed="true">Bastón elemental</button>
        <button class="chip" id="c-baston3" data-c="baston3" data-lv="3" aria-pressed="true">Bastón</button>
        <button class="chip" id="c-mochila" data-c="mochila" data-lv="34" aria-pressed="true">Mochila</button>
        <button class="chip" id="c-chullo" data-c="chullo" data-lv="2" aria-pressed="true">Chullo</button>
        <button class="chip" id="c-bufanda" data-c="bufanda" data-lv="23" aria-pressed="true">Bufanda</button>
        <button class="chip" id="c-morral" data-c="morral" data-lv="2" aria-pressed="true">Morral</button>
        <button class="chip" id="c-baston" data-c="baston" data-lv="2" aria-pressed="false">Bastón</button>
      </div>
    </div>
    <div class="row">
      <span class="label">Vistas</span>
      <div class="chips" id="views">
        <button class="chip" id="v-frente" data-v="frente" aria-pressed="false">1. Frente</button>
        <button class="chip" id="v-f34d" data-v="f34d" aria-pressed="false">2. 3/4 Frente</button>
        <button class="chip" id="v-perfd" data-v="perfd" aria-pressed="false">3. Perfil Der.</button>
        <button class="chip" id="v-a34d" data-v="a34d" aria-pressed="false">4. 3/4 Atrás Der.</button>
        <button class="chip" id="v-atras" data-v="atras" aria-pressed="false">5. Atrás</button>
        <button class="chip" id="v-a34i" data-v="a34i" aria-pressed="false">6. 3/4 Atrás Izq.</button>
        <button class="chip" id="v-perfi" data-v="perfi" aria-pressed="false">7. Perfil Izq.</button>
        <button class="chip" id="v-f34i" data-v="f34i" aria-pressed="false">8. 3/4 Frente Izq.</button>
        <button class="chip" id="v-arriba" data-v="arriba" aria-pressed="false">Arriba</button>
        <button class="chip" id="v-abajo" data-v="abajo" aria-pressed="false">Abajo</button>
        <button class="chip" id="v-girar" data-v="girar" aria-pressed="false">Girar 360°</button>
      </div>
    </div>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(function(){
const loadingEl=document.getElementById('loading');
if(!window.THREE){loadingEl.textContent='No se pudo cargar el motor 3D. Revisa tu conexión y vuelve a abrir la página.';return;}
const T=THREE;
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- renderer / scene ---------- */
const canvas=document.getElementById('stage');
const renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0x000000,0);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(30,1,0.1,100);

scene.add(new T.HemisphereLight(0xfff4ea,0xe9c3b8,0.58));
const key=new T.DirectionalLight(0xfff6ee,0.46);
key.position.set(2.6,6,4.5);key.castShadow=true;
key.shadow.mapSize.set(1024,1024);
Object.assign(key.shadow.camera,{left:-2.6,right:2.6,top:4,bottom:-1.2,near:0.5,far:20});
key.shadow.bias=-0.0006;key.shadow.normalBias=0.02;key.shadow.radius=5;
scene.add(key);
const envTex=(function(){const pm=new T.PMREMGenerator(renderer);const es=new T.Scene();
  es.add(new T.Mesh(new T.SphereGeometry(10,32,16),new T.MeshBasicMaterial({color:0x6b5a52,side:T.BackSide})));
  const panel=(w,h,p,c)=>{const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:c,side:T.DoubleSide}));m.position.copy(p);m.lookAt(0,0,0);es.add(m);};
  panel(8,4,new T.Vector3(0,7,3),0xffffff);panel(4,6,new T.Vector3(7,2,4),0xfff1dd);panel(4,6,new T.Vector3(-7,1,3),0xffe6ef);panel(10,2,new T.Vector3(0,-6,0),0x3a2a24);panel(3,6,new T.Vector3(0,2,-8),0xdde8ff);
  const t=pm.fromScene(es,0.03).texture;pm.dispose();return t;})();
const fill=new T.DirectionalLight(0xffe6dc,0.16);fill.position.set(-4,2.5,3);scene.add(fill);
const rim=new T.DirectionalLight(0xfff2ea,0.28);rim.position.set(-1,3.5,-5);scene.add(rim);

/* ---------- textures ---------- */
function radialTexture(inner,outer){
  const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,inner);g.addColorStop(0.55,inner.replace(/[\d.]+\)$/,'0.55)'));g.addColorStop(1,outer);
  x.fillStyle=g;x.fillRect(0,0,128,128);return new T.CanvasTexture(c);
}
function canvasTex(draw){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');draw(x);return new T.CanvasTexture(c);}
function starPath(x,cx,cy,R,r){x.beginPath();for(let i=0;i<8;i++){const a=-Math.PI/2+i*Math.PI/4,rr=i%2?r:R;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}x.closePath();}
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const KR='#D8474E',KRD='#B5323B',KC='#F6E2CC',KP='#EC8A83',KD='#5B4A3B';
function diamondsRow(x,W,cy,h,n,fill,inner){for(let i=0;i<n;i++){const cx=(i+0.5)*W/n;x.fillStyle=fill;x.beginPath();x.moveTo(cx,cy-h);x.lineTo(cx+h,cy);x.lineTo(cx,cy+h);x.lineTo(cx-h,cy);x.closePath();x.fill();
  if(inner){const h2=h*0.42;x.fillStyle=inner;x.beginPath();x.moveTo(cx,cy-h2);x.lineTo(cx+h2,cy);x.lineTo(cx,cy+h2);x.lineTo(cx-h2,cy);x.closePath();x.fill();}}}
function knitLines(x,W,H,step){x.globalAlpha=0.1;x.fillStyle='#000';for(let i=0;i<W;i+=step)x.fillRect(i,0,2,H);x.globalAlpha=1;}
const hatTex=(function(){const W=512,H=512,c=makeCanvas(W,H),x=c.getContext('2d');
  const band=(v0,v1,col)=>{x.fillStyle=col;x.fillRect(0,H*(1-v1),W,H*(v1-v0)+1);};
  band(0,1,KR);band(0,0.09,KRD);band(0.09,0.13,KC);band(0.13,0.3,KP);band(0.3,0.34,KC);band(0.34,0.41,KR);band(0.41,0.45,KC);band(0.45,0.58,KP);band(0.58,0.62,KC);
  diamondsRow(x,W,H*(1-0.215),H*0.07,14,KC,KD);diamondsRow(x,W,H*(1-0.515),H*0.05,20,KD,null);
  for(let i=0;i<22;i++){x.fillStyle=KD;x.fillRect((i+0.5)*W/22-4,H*(1-0.74)-4,8,8);}
  knitLines(x,W,H,8);const t=new T.CanvasTexture(c);t.wrapS=T.RepeatWrapping;return t;})();
function ribTex(base,dark,rep){const c=makeCanvas(128,32),x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,128,32);
  for(let i=0;i<8;i++){x.fillStyle=dark;x.globalAlpha=0.45;x.fillRect(i*16,0,5,32);}x.globalAlpha=1;
  const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep,1);return t;}
const scarfEndTex=(function(){const W=256,H=256,c=makeCanvas(W,H),x=c.getContext('2d');
  x.fillStyle=KR;x.fillRect(0,0,W,H);x.fillStyle=KC;x.fillRect(0,H*0.55,W,H*0.05);x.fillRect(0,H*0.9,W,H*0.05);
  diamondsRow(x,W,H*0.74,H*0.1,8,KC,KR);knitLines(x,W,H,8);
  const t=new T.CanvasTexture(c);t.wrapS=T.RepeatWrapping;return t;})();
const patchTex=canvasTex(x=>{x.fillStyle='#EE8A3E';x.beginPath();x.arc(64,64,62,0,7);x.fill();x.fillStyle='#F7E8D6';x.beginPath();x.arc(64,64,48,0,7);x.fill();
  x.fillStyle='#E9783A';x.beginPath();x.moveTo(22,86);x.lineTo(52,44);x.lineTo(70,70);x.lineTo(82,56);x.lineTo(106,86);x.closePath();x.fill();
  x.fillStyle='#F7E8D6';x.beginPath();x.moveTo(46,52);x.lineTo(52,44);x.lineTo(58,52);x.closePath();x.fill();});
const compassTex=canvasTex(x=>{x.fillStyle='#FBF6EC';x.fillRect(0,0,128,128);x.strokeStyle='#5B4A3B';x.lineWidth=4;x.beginPath();x.arc(64,64,56,0,7);x.stroke();
  x.fillStyle='#D9252F';x.beginPath();x.moveTo(64,14);x.lineTo(76,64);x.lineTo(52,64);x.closePath();x.fill();x.fillStyle='#3B5070';x.beginPath();x.moveTo(64,114);x.lineTo(76,64);x.lineTo(52,64);x.closePath();x.fill();
  x.fillStyle='#5B4A3B';x.beginPath();x.arc(64,64,6,0,7);x.fill();});
const flagTex=canvasTex(x=>{x.fillStyle='#F4EFE8';x.fillRect(0,0,128,128);x.fillStyle='#D9252F';x.fillRect(4,20,40,88);x.fillRect(84,20,40,88);x.fillStyle='#FFFFFF';x.fillRect(44,20,40,88);});
const spiralTex=canvasTex(x=>{x.fillStyle='#E0483D';x.fillRect(0,0,128,128);x.strokeStyle='#B02F28';x.lineWidth=5;x.beginPath();for(let a=0;a<6*Math.PI;a+=0.1){const r=4+a*3.1;x.lineTo(64+Math.cos(a)*r,64+Math.sin(a)*r);}x.stroke();});
const scarf3Tex=(function(){const W=256,H=256,c=makeCanvas(W,H),x=c.getContext('2d');x.fillStyle='#E5402F';x.fillRect(0,0,W,H);
  x.strokeStyle='#F2C27A';x.lineWidth=6;[[0,1],[1,0.5]].forEach(([o])=>{});
  for(let k=0;k<2;k++){const cx=W*(0.25+k*0.5),cy=H*0.62,h=H*0.16;x.beginPath();x.moveTo(cx,cy-h);x.lineTo(cx+h,cy);x.lineTo(cx,cy+h);x.lineTo(cx-h,cy);x.closePath();x.stroke();
    x.fillStyle='#F2C27A';x.beginPath();x.arc(cx,cy,h*0.22,0,7);x.fill();[[0,-1],[1,0],[0,1],[-1,0]].forEach(([a,b])=>{x.beginPath();x.arc(cx+a*h*0.5,cy+b*h*0.5,h*0.12,0,7);x.fill();});}
  const t=new T.CanvasTexture(c);t.wrapS=T.RepeatWrapping;return t;})();
const GOLD='#E8B24C',GOLDD='#B77F2A',CRED='#D2303A',CWHITE='#F8F2EA';

function tube(points,r,mat,seg){

/* ---------- face surface with built-in chubby cheeks (head local) ---------- */
const F={a:0.82,b:0.62,c:0.6,cy:0,cz:0.12};
const CHK=[{x:-0.44,y:-0.2},{x:0.44,y:-0.2}],CH_SIG=0.17;let CH_AMP=0.085,SNOUT=0;
function bulge(x,y){let s=0;for(const c of CHK){const d2=(x-c.x)**2+1.3*(y-c.y)**2;s+=Math.exp(-d2/(2*CH_SIG*CH_SIG));}return CH_AMP*s+SNOUT*Math.exp(-(x*x+1.4*(y+0.12)**2)/(2*0.13*0.13));}
function ellN(x,y,z){return new T.Vector3(x/F.a**2,(y-F.cy)/F.b**2,(z-F.cz)/F.c**2).normalize();}
function surf(x,y){
  const dy=y-F.cy,t=Math.max(1-(x/F.a)**2-(dy/F.b)**2,0.0004),vz=Math.sqrt(t),z=F.cz+F.c*vz;
  return new T.Vector3(x,y,z).addScaledVector(ellN(x,y,z),bulge(x,y)*clamp(vz*2+0.5,0,1));
}
const Z=new T.Vector3(0,0,1);
function onFace(x,y,off){
  const e=0.004,p=surf(x,y),px=surf(x+e,y).sub(p),py=surf(x,y+e).sub(p);
  const n=px.cross(py).normalize();
  return {p:p.addScaledVector(n,off||0),n};
}
function place(obj,x,y,off){const s=onFace(x,y,off);obj.position.copy(s.p);obj.quaternion.setFromUnitVectors(Z,s.n);return obj;}
function faceGeometry(){
  const g=new T.SphereGeometry(1,80,60),pos=g.attributes.position,v=new T.Vector3();
  for(let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos,i);
    const x=F.a*v.x,y=F.b*v.y+F.cy,z=F.c*v.z+F.cz,n=ellN(x,y,z),b=bulge(x,y)*clamp(v.z*2+0.5,0,1);
    pos.setXYZ(i,x+n.x*b,y+n.y*b,z+n.z*b);
  }
  g.computeVertexNormals();return g;
}

function taperTube(pts,r0,r1,seg,mat){
  const curve=new T.CatmullRomCurve3(pts);const rs=12;
  const g=new T.TubeGeometry(curve,seg,1,rs,false);const pos=g.attributes.position,v=new T.Vector3();
  for(let i=0;i<=seg;i++){const t=i/seg,c=curve.getPointAt(t),r=lerp(r0,r1,Math.pow(t,0.8));
    for(let j=0;j<=rs;j++){const idx=i*(rs+1)+j;v.fromBufferAttribute(pos,idx).sub(c).multiplyScalar(r).add(c);pos.setXYZ(idx,v.x,v.y,v.z);}}
  g.computeVertexNormals();
  const grp=new T.Group();grp.add(new T.Mesh(g,mat));
  const e0=ell(r0,r0,r0,mat,SPH_LO);e0.position.copy(pts[0]);grp.add(e0);
  const e1=ell(r1,r1,r1,mat,SPH_LO);e1.position.copy(pts[pts.length-1]);grp.add(e1);
  return {grp,curve};
}

  alpi.updateMatrixWorld(true);
  squash.getWorldQuaternion(invQ).invert();
  const aK=track(trK,scarfKnot,dt);
  const idle=reduceMotion?0:1;
  if(on('baston')){
    const aS=track(trS,stickPivot,dt);
    springStep(sSZ,clamp(aS.x*0.022,-0.45,0.45),dt);springStep(sSX,clamp(-aS.z*0.022,-0.45,0.45),dt);
    stickSway.rotation.set(sSX.a+idle*Math.sin(time*1.3)*0.02,0,sSZ.a+idle*Math.sin(time*1.1+1)*0.025);
    springStep(sLeaf,clamp(-aS.x*0.03+aS.y*0.02+sSZ.v*0.4,-0.9,0.9),dt);
    leafPivots.forEach((l,i)=>{l.rotation.z=l.userData.base+sLeaf.a*(i?0.7:1)+idle*Math.sin(time*(2.1+i*0.6)+i)*0.1;});
  }
  // chullo pompom + tassels swing from head motion
  const aH=track(trH,pomPivot,dt);
  springStep(pomS.x,clamp(-aH.z*0.03-aH.y*0.01,-0.7,0.7),dt);springStep(pomS.z,clamp(aH.x*0.03,-0.7,0.7),dt);
  pomPivot.rotation.set(pomS.x.a+idle*Math.sin(time*1.7)*0.03,0,pomS.z.a);
  tassels.forEach((t,i)=>{springStep(t.sx,clamp(aH.z*0.035+aH.y*0.02,-0.9,0.9),dt);springStep(t.sz,clamp(-aH.x*0.035*t.side,-0.9,0.9)+idle*Math.sin(time*1.9+i)*0.04,dt);
    t.tp.rotation.set(t.sx.a,0,t.sz.a);});
  // satchel sways on its strap
  const aB=track(trB,bagPivot,dt);
  springStep(sBX,clamp(aB.z*0.025,-0.5,0.5),dt);springStep(sBZ,clamp(-aB.x*0.025,-0.5,0.5),dt);
  bagSwing.rotation.set(sBX.a,0,sBZ.a);
  if(LEVEL===4){
    const a4=track(trC,capeletAll,dt);
    if(on('capa'))capeStep(dt,time,idle);
    tassels4.forEach(tq=>{tq.p.rotation.set(clamp(a4.z*0.03,-0.6,0.6)+idle*Math.sin(time*2+tq.ph)*0.06,0,clamp(-a4.x*0.03,-0.6,0.6)+idle*Math.sin(time*1.7+tq.ph)*0.05);});
    if(on('baston4')){const aS4=track(trS4,staffPivot,dt);springStep(s4Z,clamp(aS4.x*0.012,-0.3,0.3),dt);springStep(s4X,clamp(-aS4.z*0.012,-0.3,0.3),dt);
      staffSway.rotation.set(s4X.a+idle*Math.sin(time*1.2)*0.015,0,s4Z.a+idle*Math.sin(time*0.9+1)*0.02);
      orbArcs.forEach((o,i)=>{if(o.spiral){o.g.rotation.y+=dt*o.sp;}else{o.g.rotation.z+=dt*o.sp;o.g.rotation.y+=dt*o.sp*0.35;}o.arc.material.opacity=0.55+0.3*Math.sin(time*4+i);});
      const pa=orbPts.geometry.attributes.position;orbPD.forEach((d,i)=>{d.a+=dt*d.s;d.t+=dt*0.5;const r=d.r*(1+0.15*Math.sin(d.t*3));pa.setXYZ(i,Math.cos(d.a)*r,d.h+Math.sin(d.a*1.5)*0.08,Math.sin(d.a)*r);});pa.needsUpdate=true;}
    glows4.forEach((g,i)=>{if(g.orb){const pl=1+0.12*Math.sin(time*3.2);g.g1.scale.setScalar(0.8*pl);g.g2.scale.setScalar(1.7*(1+0.08*Math.sin(time*2.1)));}
      else{const sp=g.children[1];sp.material.opacity=0.4+0.25*Math.sin(time*2.5+i);}});
  }
  if(LEVEL===3){const aP=track(trP,packSwing,dt);springStep(sPX,clamp(aP.z*0.012+aP.y*0.006,-0.18,0.18),dt);springStep(sPZ,clamp(-aP.x*0.012,-0.18,0.18),dt);packSwing.rotation.set(sPX.a,0,sPZ.a);}
  const tx=clamp(aK.z*0.03+aK.y*0.02,-1.1,0.15),tz=clamp(-aK.x*0.03,-0.8,0.8);
  scarfTails.forEach(st=>{st.joints.forEach((j,i)=>{const w=[0.55,0.45][i];
    springStep(st.sx[i],tx*w,dt);springStep(st.sz[i],tz*w+idle*Math.sin(time*1.6+st.ph+i*0.7)*0.03,dt);
    j.rotation.set(st.sx[i].a,0,st.sz[i].a);});});

  // floating effects
  FX.star.forEach((s,i)=>{const w=cur.fxStar,tw2=0.75+0.25*Math.sin(time*4+i*2);s.material.opacity=w*clamp(tw2,0,1);s.material.rotation=Math.sin(time*1.5+i)*0.3;s.scale.setScalar(s.userData.size*tw2*(0.5+0.5*w));});
  FX.puff.forEach((s,i)=>{const u=(time*0.9+i*0.5)%1,b=s.userData.base,f=s.userData.flip;
    s.position.set(b.x+f*u*0.15,b.y+u*0.3,b.z);const sz=s.userData.size*(0.6+u*0.7);s.scale.set(sz*f,sz,1);s.material.opacity=cur.fxPuff*(1-u)*Math.min(1,u*5);});
  FX.bang.forEach(s=>{const sz=s.userData.size*(1+0.12*Math.sin(time*10));s.scale.set(sz,sz,1);s.material.opacity=cur.fxBang;});
  [['dash',cur.fxDash],['dashY',cur.fxDashY]].forEach(([k2,w])=>FX[k2].forEach((s,i)=>{const pl=0.85+0.15*Math.sin(time*8+i);const sz=s.userData.size*pl;s.scale.set(sz*s.userData.flip,sz,1);s.material.opacity=w*(0.6+0.4*Math.sin(time*8+i));}));
  FX.q.forEach(s=>{const sz=s.userData.size*(1+0.08*Math.sin(time*5));s.scale.set(sz,sz,1);s.material.rotation=Math.sin(time*2.5)*0.15;s.material.opacity=cur.fxQ;});
  FX.anger.forEach((s,i)=>{const pl=1+0.18*Math.max(0,Math.sin(time*9+i*1.5));const sz=s.userData.size*pl;s.scale.set(sz*s.userData.flip,sz,1);s.material.opacity=cur.fxAnger;});
  FX.z.forEach(s=>{const u=(time*0.45+s.userData.ph)%1;s.position.set(0.75+u*0.35+Math.sin(u*6)*0.05,1.05+u*0.75,0.35);
    const sc=0.14+u*0.16;s.scale.set(sc,sc,1);s.material.opacity=cur.zzz*Math.sin(u*Math.PI);});

  // floor shadow follows the jump
  const sh=1/(1+cur.y*0.9);blob.scale.set(1.9*sh*(1+0.25*cur.flat),1.5*sh,1);blob.material.opacity=sh;

  if(shake>0){camera.position.x+=(Math.random()-0.5)*shake;camera.position.y+=(Math.random()-0.5)*shake;camera.position.z+=(Math.random()-0.5)*shake*0.5;}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(()=>{frame();loadingEl.hidden=true;});

/* ---------- API for embedding in an app (iframe / WebView) ---------- */
const EXPR_ALIAS={emocionado:'emocionada',curioso:'curiosa',dormido:'dormida',concentrado:'concentrada',molesto:'molesta',furioso:'furiosa',reganon:'reganona',orgulloso:'orgullosa'};
const API={
  setLevel:n=>requestLevel(+n),
  setLevelInstant:n=>{setLevel(+n);cur.m=mT;cur.bp=BPS[+n].slice();},
  setExpression:e=>{e=EXPR_ALIAS[e]||e||'normal';if(e!=='normal'&&e===expr)return;setExpr(e);},
  play:a=>play(a),
  setView:v=>setView(v),
  setAccessory:(k,on)=>{ACC[k]=!!on;applyAcc();},
  setSound:on=>{SND.on=!!on;},
  getState:()=>({level:LEVEL,expression:expr||'normal',action:action||null})
};
window.Alpi=API;
window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='alpi'||!API[d.cmd])return;const r=API[d.cmd].apply(null,d.args||[]);
  if(d.cmd==='getState'&&e.source)try{e.source.postMessage({type:'alpi-state',state:r},'*');}catch(_){}});
try{const q=new URLSearchParams(location.search);
  if(q.has('embed')||window.ALPI_EMBED){document.querySelector('.panel').hidden=true;document.querySelector('.top').hidden=true;}
  if(q.has('transparent')){document.body.style.background='transparent';}
  if(q.get('level'))API.setLevelInstant(q.get('level'));
  if(q.get('expr'))API.setExpression(q.get('expr'));
  if(window.parent!==window)window.parent.postMessage({type:'alpi-ready'},'*');
  if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(JSON.stringify({type:'alpi-ready'}));}catch(_){}
})();
</script>
